name: WAMS CI & Quality Pipeline

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'security/**'
  pull_request:
    branches:
      - main

jobs:
  lint-and-typecheck:
    name: TypeScript & Linting Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript Compile Check
        run: bun run lint

  automated-tests:
    name: GIS Map, Security & Export Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Test Suite (Vitest)
        run: bun run test

      - name: Security Scan (Verify No Hardcoded Passwords in Export Templates)
        run: |
          echo "Scanning for plaintext passwords in export generators..."
          ! grep -rn "wams_local_dev_password" src/utils/spatialQueryEngine.ts
          ! grep -rn "password=" src/utils/spatialQueryEngine.ts

  build-verification:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, automated-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Production Assets
        run: bun run build
